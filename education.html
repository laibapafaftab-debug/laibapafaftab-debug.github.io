<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Education & Skills — Laiba Aftab</title>
  
  <!-- SEO Meta Tags -->
  <meta property="og:title" content="Education & Skills — Laiba Aftab">
  <meta property="og:description" content="Academic background, tech stack, and platforms for web and Python development.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0f1c; --bg-alt: #0d1526; --surface: #101c30; --surface-alt: #152238;
      --text: #eef1f6; --text-dim: #8b96ac; --text-faint: #5c6780;
      --gold: #d4a24c; --teal: #4fd1c5; --green: #5fe0a0;
      --border: rgba(255, 255, 255, 0.08); --border-strong: rgba(255, 255, 255, 0.14);
      --radius: 14px; --maxw: 1160px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.6; overflow-x: hidden; }
    
    /* Background Canvas */
    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    
    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; position: relative; z-index: 1; }
    
    /* Navigation */
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; backdrop-filter: blur(14px); background: rgba(10, 15, 28, 0.72); border-bottom: 1px solid var(--border); }
    .navbar { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; height: 74px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 8px; }
    .logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 12px var(--teal); }
    
    .nav-toggle { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
    nav.links { display: flex; gap: 32px; font-size: 14.5px; color: var(--text-dim); }
    nav.links a { transition: color .2s; }
    nav.links a.active { color: var(--teal); }
    
    @media(max-width:820px){
      .nav-toggle { display: block; }
      nav.links { display: none; flex-direction: column; position: absolute; top: 74px; left: 0; right: 0; background: var(--surface); padding: 20px 28px; border-bottom: 1px solid var(--border); gap: 20px; }
      nav.links.open { display: flex; }
    }

    /* Rest of the original styling... */
    section { padding: 60px 0 110px; position: relative; }
    .page-hero { padding: 150px 0 30px; }
    .page-hero h1 { font-size: clamp(34px, 5vw, 52px); margin-bottom: 14px; }
    .tabs-row { display: flex; align-items: center; gap: 22px; margin: 40px 0 44px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px; }
    .tab-btn { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 9px; color: var(--text-dim); cursor: pointer; border: none; background: transparent; transition: background .2s, color .2s; }
    .tab-btn.active { background: linear-gradient(95deg, var(--teal), var(--gold)); color: #0a0f1c; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    @media(max-width:960px){ .cards-grid { grid-template-columns: 1fr 1fr; } }
    @media(max-width:640px){ .cards-grid { grid-template-columns: 1fr; } }
    .edu-card, .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px 26px; }
    .cta-band { background: linear-gradient(120deg, var(--surface-alt), var(--bg-alt)); border: 1px solid var(--border); border-radius: 24px; padding: 56px; text-align: center; margin-top: 60px; }
    .btn-primary { background: var(--gold); color: #1a1206; padding: 14px 26px; border-radius: 10px; font-weight: 600; display: inline-block; }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<header>
  <div class="navbar">
    <div class="logo"><span class="dot"></span>Laiba<span class="mono" style="color:var(--text-dim); font-weight:400;">.dev</span></div>
    <button class="nav-toggle" aria-label="Menu" onclick="document.querySelector('nav.links').classList.toggle('open')">☰</button>
    <nav class="links">
      <a href="services.html">Services</a>
      <a href="index.html#process">Process</a>
      <a href="education.html" class="active">Education</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="page-hero">
    <h1>Education & Skills</h1>
  </section>

  <div class="tabs-row" role="tablist">
    <div class="tabs">
      <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="tab-education" data-tab="education">🎓 Education</button>
      <button class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-skills" data-tab="skills">🛠 Skills</button>
    </div>
  </div>

  <div class="tab-panel active" id="tab-education" role="tabpanel">
    <div class="cards-grid">
      <div class="edu-card"><h3>Bachelor of Science (BSCS)</h3></div>
      <div class="edu-card"><h3>Intermediate</h3></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-skills" role="tabpanel">
    <div class="cards-grid">
      <div class="info-card"><h3>Web Development</h3></div>
      <div class="info-card"><h3>Python</h3></div>
    </div>
  </div>
</main>

<script>
  /* Particle Background Logic */
  (function () {
    var canvas = document.getElementById('bg-canvas');
    var ctx = canvas.getContext('2d');
    var w, h, particles;
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    function initParticles() {
      particles = [];
      for (var i = 0; i < 50; i++) {
        particles.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });
      }
    }
    function draw() {
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = 'rgba(79, 209, 197, 0.2)';
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if(p.x < 0 || p.x > w) p.vx *= -1;
        if(p.y < 0 || p.y > h) p.vy *= -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    resize(); initParticles(); draw();
    window.addEventListener('resize', resize);
  })();

  /* Accessible Tabs Logic */
  var tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active'); b.setAttribute('aria-selected', 'false');
      });
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active'); btn.setAttribute('aria-selected', 'true');
      document.getElementById(btn.getAttribute('aria-controls')).classList.add('active');
    });
  });
</script>

</body>
</html>
