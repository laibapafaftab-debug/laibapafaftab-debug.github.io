<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a24c"/>
      <stop offset="100%" stop-color="#4fd1c5"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(79,209,197,0.18)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad1)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>

  <!-- Decorative floating dots -->
  <circle cx="90" cy="70" r="3" fill="#4fd1c5" opacity="0.5"/>
  <circle cx="730" cy="110" r="2.5" fill="#d4a24c" opacity="0.5"/>
  <circle cx="670" cy="380" r="3" fill="#4fd1c5" opacity="0.4"/>
  <circle cx="60" cy="360" r="2" fill="#d4a24c" opacity="0.5"/>

  <!-- Calendar card -->
  <g transform="translate(90,115)">
    <rect x="0" y="0" width="230" height="220" rx="16" fill="#101c30" stroke="#2a3852" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="46" rx="16" fill="#0d1526"/>
    <rect x="0" y="30" width="230" height="16" fill="#0d1526"/>
    <circle cx="26" cy="23" r="4" fill="#d4a24c"/>
    <circle cx="42" cy="23" r="4" fill="#4fd1c5"/>
    <text x="60" y="28" font-family="monospace" font-size="12" fill="#8b96ac">booking.calendar</text>

    <!-- calendar grid -->
    <g transform="translate(20,64)">
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#eef1f6">September</text>
      <g font-family="monospace" font-size="10" fill="#5c6780">
        <text x="0" y="26">S</text><text x="28" y="26">M</text><text x="56" y="26">T</text>
        <text x="84" y="26">W</text><text x="112" y="26">T</text><text x="140" y="26">F</text><text x="168" y="26">S</text>
      </g>
      <g font-family="monospace" font-size="11" fill="#8b96ac">
        <text x="2" y="50">1</text><text x="30" y="50">2</text><text x="58" y="50">3</text>
        <text x="86" y="50">4</text><text x="114" y="50">5</text><text x="142" y="50">6</text><text x="170" y="50">7</text>
        <text x="2" y="76">8</text><text x="30" y="76">9</text>
      </g>
      <circle cx="60" cy="72" r="12" fill="url(#accentGrad1)"/>
      <text x="55" y="76" font-family="monospace" font-size="11" fill="#0a0f1c" font-weight="700">10</text>
      <text x="86" y="76" font-family="monospace" font-size="11" fill="#8b96ac">11</text>
      <text x="114" y="76" font-family="monospace" font-size="11" fill="#8b96ac">12</text>
      <text x="142" y="76" font-family="monospace" font-size="11" fill="#8b96ac">13</text>
      <text x="170" y="76" font-family="monospace" font-size="11" fill="#8b96ac">14</text>
    </g>

    <!-- selected slot -->
    <g transform="translate(20,168)">
      <rect x="0" y="0" width="190" height="34" rx="8" fill="rgba(79,209,197,0.12)" stroke="#4fd1c5" stroke-width="1"/>
      <text x="14" y="21" font-family="monospace" font-size="11" fill="#4fd1c5">10:00 AM — Available</text>
    </g>
  </g>

  <!-- Salon chair / scissors motif -->
  <g transform="translate(400,60)">
    <circle cx="130" cy="130" r="118" fill="rgba(212,162,76,0.06)"/>
    <!-- mirror frame -->
    <ellipse cx="130" cy="115" rx="80" ry="98" fill="none" stroke="#d4a24c" stroke-width="3" opacity="0.55"/>
    <ellipse cx="130" cy="115" rx="65" ry="82" fill="rgba(21,34,56,0.6)"/>
    <!-- simple stylized figure silhouette -->
    <circle cx="130" cy="82" r="26" fill="#152238" stroke="#4fd1c5" stroke-width="1.5"/>
    <path d="M 90 175 Q 130 140 170 175 L 170 200 L 90 200 Z" fill="#152238" stroke="#4fd1c5" stroke-width="1.5"/>
    <!-- scissors icon -->
    <g transform="translate(210,220) rotate(-20)">
      <circle cx="0" cy="0" r="9" fill="none" stroke="#d4a24c" stroke-width="3"/>
      <circle cx="0" cy="24" r="9" fill="none" stroke="#d4a24c" stroke-width="3"/>
      <line x1="6" y1="6" x2="46" y2="46" stroke="#d4a24c" stroke-width="3" stroke-linecap="round"/>
      <line x1="6" y1="18" x2="46" y2="-22" stroke="#d4a24c" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Bottom label bar -->
  <g transform="translate(0,392)">
    <rect x="0" y="0" width="800" height="58" fill="rgba(10,15,28,0.55)"/>
    <rect x="0" y="0" width="800" height="2" fill="url(#accentGrad1)"/>
    <text x="90" y="34" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#eef1f6">Bloom &amp; Blade Salon</text>
    <text x="680" y="34" font-family="monospace" font-size="12" fill="#4fd1c5" text-anchor="end">Lahore, PK</text>
  </g>
</svg>
