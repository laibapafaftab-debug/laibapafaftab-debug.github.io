<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#d4a24c"/>
    </linearGradient>
    <radialGradient id="glow2" cx="80%" cy="10%" r="70%">
      <stop offset="0%" stop-color="rgba(212,162,76,0.14)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  <rect width="800" height="450" fill="url(#glow2)"/>

  <!-- Skyline silhouette -->
  <g opacity="0.5" fill="#152238">
    <rect x="40" y="260" width="50" height="150"/>
    <rect x="100" y="220" width="40" height="190"/>
    <rect x="150" y="280" width="55" height="130"/>
    <rect x="620" y="240" width="45" height="170"/>
    <rect x="675" y="200" width="38" height="210"/>
    <rect x="720" y="270" width="50" height="140"/>
  </g>
  <g opacity="0.35" stroke="#2a3852" stroke-width="1">
    <line x1="55" y1="270" x2="55" y2="400"/>
    <line x1="70" y1="270" x2="70" y2="400"/>
    <line x1="632" y1="250" x2="632" y2="400"/>
    <line x1="648" y1="250" x2="648" y2="400"/>
  </g>

  <!-- Main dashboard card -->
  <g transform="translate(190,90)">
    <rect x="0" y="0" width="420" height="270" rx="16" fill="#101c30" stroke="#2a3852" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="42" rx="16" fill="#0d1526"/>
    <rect x="0" y="28" width="420" height="14" fill="#0d1526"/>
    <circle cx="24" cy="21" r="4" fill="#d4a24c"/>
    <circle cx="40" cy="21" r="4" fill="#4fd1c5"/>
    <circle cx="56" cy="21" r="4" fill="#5c6780"/>
    <text x="380" y="26" font-family="monospace" font-size="11" fill="#5c6780" text-anchor="end">case-study.pdf</text>

    <text x="26" y="76" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#eef1f6">Quarterly Growth Report</text>
    <text x="26" y="98" font-family="monospace" font-size="11" fill="#8b96ac">Client engagement funnel — Q3 overview</text>

    <!-- bar chart -->
    <g transform="translate(26,120)">
      <line x1="0" y1="120" x2="360" y2="120" stroke="#2a3852" stroke-width="1"/>
      <rect x="10"  y="70" width="30" height="50" rx="3" fill="rgba(79,209,197,0.35)"/>
      <rect x="55"  y="50" width="30" height="70" rx="3" fill="rgba(79,209,197,0.5)"/>
      <rect x="100" y="30" width="30" height="90" rx="3" fill="url(#accentGrad2)"/>
      <rect x="145" y="60" width="30" height="60" rx="3" fill="rgba(79,209,197,0.4)"/>
      <rect x="190" y="20" width="30" height="100" rx="3" fill="url(#accentGrad2)"/>
      <rect x="235" y="45" width="30" height="75" rx="3" fill="rgba(79,209,197,0.45)"/>
      <!-- line overlay -->
      <polyline points="25,60 70,40 115,20 160,50 205,10 250,35" fill="none" stroke="#d4a24c" stroke-width="2" opacity="0.8"/>
      <circle cx="115" cy="20" r="3.5" fill="#d4a24c"/>
      <circle cx="205" cy="10" r="3.5" fill="#d4a24c"/>
    </g>

    <!-- stat pills -->
    <g transform="translate(290,120)">
      <rect x="0" y="0" width="104" height="54" rx="10" fill="rgba(79,209,197,0.1)" stroke="#4fd1c5" stroke-width="1"/>
      <text x="12" y="22" font-family="monospace" font-size="10" fill="#8b96ac">CONVERSIONS</text>
      <text x="12" y="42" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#4fd1c5">+64%</text>

      <rect x="0" y="66" width="104" height="54" rx="10" fill="rgba(212,162,76,0.1)" stroke="#d4a24c" stroke-width="1"/>
      <text x="12" y="88" font-family="monospace" font-size="10" fill="#8b96ac">AVG. SESSION</text>
      <text x="12" y="108" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#d4a24c">3m 42s</text>
    </g>
  </g>

  <!-- Floating briefcase icon -->
  <g transform="translate(650,60)">
    <rect x="0" y="18" width="60" height="42" rx="8" fill="#152238" stroke="url(#accentGrad2)" stroke-width="2"/>
    <path d="M 18 18 L 18 8 Q 18 2 24 2 L 36 2 Q 42 2 42 8 L 42 18" fill="none" stroke="url(#accentGrad2)" stroke-width="2.5"/>
    <line x1="0" y1="36" x2="60" y2="36" stroke="#0a0f1c" stroke-width="2"/>
  </g>

  <!-- Bottom label bar -->
  <g transform="translate(0,392)">
    <rect x="0" y="0" width="800" height="58" fill="rgba(10,15,28,0.55)"/>
    <rect x="0" y="0" width="800" height="2" fill="url(#accentGrad2)"/>
    <text x="190" y="34" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#eef1f6">Ashworth &amp; Reeve Consulting</text>
    <text x="710" y="34" font-family="monospace" font-size="12" fill="#d4a24c" text-anchor="end">United Kingdom</text>
  </g>
</svg>
