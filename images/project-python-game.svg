<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="accentGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#d4a24c"/>
    </linearGradient>
    <radialGradient id="glow3" cx="20%" cy="80%" r="70%">
      <stop offset="0%" stop-color="rgba(79,209,197,0.16)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)"/>
  <rect width="800" height="450" fill="url(#glow3)"/>

  <!-- Dot grid game-board texture -->
  <g fill="#2a3852" opacity="0.4">
    <circle cx="40" cy="40" r="1.6"/><circle cx="80" cy="40" r="1.6"/><circle cx="120" cy="40" r="1.6"/>
    <circle cx="40" cy="80" r="1.6"/><circle cx="80" cy="80" r="1.6"/><circle cx="120" cy="80" r="1.6"/>
    <circle cx="680" cy="360" r="1.6"/><circle cx="720" cy="360" r="1.6"/><circle cx="760" cy="360" r="1.6"/>
    <circle cx="680" cy="400" r="1.6"/><circle cx="720" cy="400" r="1.6"/><circle cx="760" cy="400" r="1.6"/>
  </g>

  <!-- Code editor card -->
  <g transform="translate(60,95)">
    <rect x="0" y="0" width="330" height="255" rx="14" fill="#0d1526" stroke="#2a3852" stroke-width="1.5"/>
    <rect x="0" y="0" width="330" height="36" rx="14" fill="#101c30"/>
    <rect x="0" y="24" width="330" height="12" fill="#101c30"/>
    <circle cx="22" cy="18" r="4" fill="#d4a24c"/>
    <circle cx="38" cy="18" r="4" fill="#4fd1c5"/>
    <circle cx="54" cy="18" r="4" fill="#5c6780"/>
    <text x="300" y="23" font-family="monospace" font-size="10" fill="#5c6780" text-anchor="end">game.py</text>

    <g font-family="monospace" font-size="12.5">
      <text x="20" y="66"><tspan fill="#d4a24c">import</tspan><tspan fill="#eef1f6"> pygame</tspan></text>
      <text x="20" y="90"><tspan fill="#d4a24c">class</tspan><tspan fill="#4fd1c5"> Player</tspan><tspan fill="#eef1f6">(Sprite):</tspan></text>
      <text x="36" y="114"><tspan fill="#d4a24c">def</tspan><tspan fill="#4fd1c5"> __init__</tspan><tspan fill="#eef1f6">(self):</tspan></text>
      <text x="52" y="138"><tspan fill="#eef1f6">self.speed = </tspan><tspan fill="#8b96ac">5</tspan></text>
      <text x="52" y="162"><tspan fill="#eef1f6">self.score = </tspan><tspan fill="#8b96ac">0</tspan></text>
      <text x="36" y="186"><tspan fill="#d4a24c">def</tspan><tspan fill="#4fd1c5"> update</tspan><tspan fill="#eef1f6">(self):</tspan></text>
      <text x="52" y="210"><tspan fill="#d4a24c">if</tspan><tspan fill="#eef1f6"> collide(): </tspan></text>
      <text x="68" y="230"><tspan fill="#eef1f6">self.score += </tspan><tspan fill="#8b96ac">10</tspan></text>
    </g>
  </g>

  <!-- Game screen preview -->
  <g transform="translate(430,80)">
    <rect x="0" y="0" width="300" height="230" rx="14" fill="#0a0f1c" stroke="url(#accentGrad3)" stroke-width="2"/>
    <!-- starfield -->
    <g fill="#eef1f6">
      <circle cx="24" cy="20" r="1.2" opacity="0.7"/>
      <circle cx="60" cy="40" r="1" opacity="0.5"/>
      <circle cx="120" cy="15" r="1.4" opacity="0.6"/>
      <circle cx="200" cy="30" r="1" opacity="0.5"/>
      <circle cx="250" cy="55" r="1.3" opacity="0.7"/>
      <circle cx="280" cy="18" r="1" opacity="0.5"/>
      <circle cx="40" cy="90" r="1" opacity="0.4"/>
      <circle cx="160" cy="70" r="1.2" opacity="0.6"/>
    </g>
    <!-- player ship -->
    <g transform="translate(140,150)">
      <polygon points="0,-16 14,14 0,6 -14,14" fill="url(#accentGrad3)"/>
    </g>
    <!-- obstacles -->
    <circle cx="70" cy="90" r="10" fill="#d4a24c" opacity="0.8"/>
    <circle cx="230" cy="110" r="8" fill="#4fd1c5" opacity="0.8"/>
    <rect x="180" y="60" width="16" height="16" fill="#4fd1c5" opacity="0.6" transform="rotate(20 188 68)"/>
    <!-- HUD -->
    <text x="14" y="200" font-family="monospace" font-size="12" fill="#4fd1c5">SCORE: 1280</text>
    <text x="286" y="200" font-family="monospace" font-size="12" fill="#d4a24c" text-anchor="end">LVL 4</text>
    <rect x="14" y="212" width="272" height="6" rx="3" fill="#152238"/>
    <rect x="14" y="212" width="180" height="6" rx="3" fill="url(#accentGrad3)"/>
  </g>

  <!-- Python logo motif -->
  <g transform="translate(590,320) scale(1.1)" opacity="0.9">
    <path d="M0 0 C0 -10 8 -14 20 -14 C32 -14 38 -10 38 -2 L38 8 L18 8 L18 12 L46 12 C46 12 54 12 54 24 C54 36 46 38 38 38 L28 38 L28 30 C28 30 28 22 36 22 L20 22 C20 22 12 22 12 12 L12 -2 C12 -10 0 -10 0 0 Z" fill="#4fd1c5" opacity="0.85"/>
    <path d="M60 46 C60 56 52 60 40 60 C28 60 22 56 22 48 L22 38 L42 38 L42 34 L14 34 C14 34 6 34 6 22 C6 10 14 8 22 8 L32 8 L32 16 C32 16 32 24 24 24 L40 24 C40 24 48 24 48 34 L48 48 C48 56 60 56 60 46 Z" fill="#d4a24c" opacity="0.85"/>
  </g>

  <!-- Bottom label bar -->
  <g transform="translate(0,392)">
    <rect x="0" y="0" width="800" height="58" fill="rgba(10,15,28,0.55)"/>
    <rect x="0" y="0" width="800" height="2" fill="url(#accentGrad3)"/>
    <text x="60" y="34" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#eef1f6">Star Runner — Python Game</text>
    <text x="740" y="34" font-family="monospace" font-size="12" fill="#4fd1c5" text-anchor="end">Pygame</text>
  </g>
</svg>
